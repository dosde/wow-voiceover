name: Community lines

# Validates contributed voice-line texts and keeps the combined file up to date.
# It never generates or uploads audio.

on:
  pull_request:
    paths:
      - "community/lines/**"
      - "community/validate_lines.py"
  push:
    branches: [forever]
    paths:
      - "community/lines/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contributions
        run: python community/validate_lines.py --check

  rebuild:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the combined file
        run: python community/validate_lines.py --check --rebuild
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/collected_lines.json
          git diff --cached --quiet || git commit -m "Rebuild combined community lines"
          git push
